# Blueprint do Render (raiz do repositório). Segredos nunca ficam aqui:
# - AUTH_SECRET é gerado pelo Render (generateValue);
# - REMOTE_LLM_API_KEY, GOOGLE_FACT_CHECK_API_KEY e CORS_ALLOWED_ORIGINS são pedidos no painel (sync: false).
services:
  - type: web
    name: evidencia-backend
    runtime: python
    rootDir: backend
    region: oregon
    # O plano free hiberna após 15 min ocioso e o primeiro pedido pode passar do limite de 30 s
    # da extensão. Para uso público, prefira "starter".
    plan: free
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENV
        value: production
      - key: LLM_PROVIDER
        value: remote
      - key: REMOTE_LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: REMOTE_LLM_MODEL
        value: google/gemma-4-31b-it:free
      - key: REMOTE_LLM_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "15.0"
      - key: REQUIRE_AUTH
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: evidencia-ratelimit
          property: connectionString

  - type: keyvalue
    name: evidencia-ratelimit
    region: oregon
    plan: free
    # Sem acesso externo: apenas serviços do mesmo workspace e região.
    ipAllowList: []
    maxmemoryPolicy: volatile-lru
