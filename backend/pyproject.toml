[project]
name = "evidencia-backend"
version = "1.0.0"
description = "Backend Proxy Seguro para a Extensao EvidencIA (Fact-Checking)"
authors = [{ name = "Equipe EvidencIA" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0",
    "httpx2>=2.13.1",
    "ruff>=0.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0",
    "httpx2>=2.13.1",
    "ruff>=0.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*"]

[tool.setuptools.package-data]
"ml.datasets" = ["*.json", "*.yaml"]
"ml.classifier" = ["model.json"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
