name: CI/CD Pipeline — EvidencIA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ==========================================
  # Frontend Pipeline: Extension (Manifest V3)
  # lint front -> build front -> test front -> deploy front
  # ==========================================

  lint-front:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Lint & Typecheck
        run: npm run lint

  build-front:
    name: Build Frontend
    needs: [lint-front]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Extension Artifacts
        run: npm run build

      - name: Archive Extension Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-dist
          path: extension/dist/
          retention-days: 7

  test-front:
    name: Test Frontend
    needs: [build-front]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Unit Tests with Coverage (Vitest)
        run: npm run test:coverage

      - name: Download Extension Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-dist
          path: extension/dist

      - name: Setup Python for E2E Backend
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install E2E Backend and Chromium
        run: |
          python -m pip install -r ../backend/requirements-dev.txt
          npx playwright install --with-deps chromium

      - name: Acceptance, Keyboard and Accessibility Tests
        run: npm run test:e2e

      - name: Archive E2E Test Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-evidence
          path: |
            extension/coverage/
            extension/test-results/
          retention-days: 14

  deploy-front:
    name: Package Development Extension
    needs: [test-front, check-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Extension Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-dist
          path: extension/dist

      - name: Package Development Extension
        run: |
          mkdir -p package
          cd dist && zip -r ../package/evidencia-extension-mv3.zip ./*
          cd ..
          ls -la package/

      - name: Archive Distribution Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-development-package
          path: extension/package/evidencia-extension-mv3.zip
          retention-days: 30

      - name: Deployment Gate & Status
        if: github.ref == 'refs/heads/main'
        run: echo "Development extension package generated; production requires an explicit HTTPS backend build."

  # ==========================================
  # Backend Pipeline: Proxy (Python / FastAPI)
  # lint back -> build back -> test back -> deploy back
  # ==========================================

  lint-back:
    name: Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install Linting Tools
        run: uv sync --frozen --extra dev

      - name: Run Ruff Linter & Syntax Compile
        run: |
          uv run ruff check . ../scripts --config pyproject.toml
          uv run python -m compileall -q app ml tests

  build-back:
    name: Build Backend
    needs: [lint-back]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install Runtime Dependencies
        run: uv sync --frozen

      - name: Verify Application Imports & Structure
        run: |
          uv run python -c "import app.main; print('FastAPI application initialized successfully.')"

      - name: Build Source and Binary Distributions
        run: uv build

      - name: Archive Backend Package Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  test-back:
    name: Test Backend
    needs: [build-back]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies & Test Suite
        run: uv sync --frozen --extra dev

      - name: Run Backend Integration & Unit Tests
        run: uv run pytest -v --cov=app --cov-report=term-missing

  check-drift:
    name: Check Documentation & Contract Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout EvidencIA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: evidencia

      - name: Checkout Documentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: evidencia-grupo/documentation
          ref: 27561529e989aa14621b0be5c4e3bc5a519cc9f9
          path: documentation

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Drift Checker Dependencies
        run: pip install -r evidencia/backend/requirements-dev.txt

      - name: Run Drift Check (Fail-Closed)
        run: |
          cd evidencia
          python scripts/generate_contracts.py --check
          python scripts/check_drift.py --docs ../documentation

  deploy-back:
    name: Package Backend
    needs: [test-back, check-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Backend Package Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Deployment Gate & Status
        if: github.ref == 'refs/heads/main'
        run: echo "Backend wheel validated; container and cloud deployment require environment verification."

  test-experiment:
    name: Validate Fake.br Delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/fakebr
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/fakebr/requirements-lock.txt
      - name: Install Isolated Experiment Environment
        run: python -m pip install -r requirements-lock.txt
      - name: Verify Model Artifacts and Evaluation
        run: python -m unittest source.test_experiment -v
